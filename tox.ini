[tox]
requires =
    tox>=4.28,<5
    tox-uv>=1.26,<2
env_list =
    py{39,310,311,312,313}-certbot3
    py{310,311,312,313,314}-certbot5

[testenv]
description = test the installed wheel with {env_name}
runner = uv-venv-runner
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=8,<10
    certbot3: certbot==3.0.0
    certbot3: acme==3.0.0
    certbot3: pyopenssl<25
    certbot5: certbot>=5,<6
    certbot5: acme>=5,<6
# Run outside the checkout, as in certbot-dns-alias.
change_dir = {env_tmp_dir}
commands_pre =
    certbot3: python -c "from certbot_dns_aliyun_next.compat import metadata; assert metadata.version('certbot') == '3.0.0'; assert metadata.version('acme') == '3.0.0'; print('Host Certbot:', metadata.version('certbot'))"
    certbot5: python -c "from certbot_dns_aliyun_next.compat import metadata; assert metadata.version('certbot').startswith('5.'); assert metadata.version('acme').startswith('5.'); print('Host Certbot:', metadata.version('certbot'))"
commands =
    python -m pytest --import-mode=importlib {posargs:{tox_root}/tests}
    python {tox_root}/scripts/check_installation.py
